[project]
name = "planner-bot"
version = "0.1.0"
description = "Single-user Telegram planner bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "anthropic>=1.0",
    "faster-whisper>=1.1",
    "av<19",  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 19
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # emoji and Cyrillic in strings are intentional

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP"]
